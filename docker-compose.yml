version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: kazihr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kazihr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kazihr_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kazihr_app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: kazihr_db
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - kazihr_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  kazihr_network:
    driver: bridge
